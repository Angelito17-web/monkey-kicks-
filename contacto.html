<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Monkey Kicks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="marca" href="index.html">
      <img src="assets/img/monkey-kicks-logo.png" alt="Logo de Monkey Kicks">
      <span>Monkey Kicks</span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="tenis.html">Tenis</a>
      <a href="contacto.html" class="activo">Contacto</a>
    </nav>
  </header>
  <main>
    <h1>Contacto</h1>
    <p>Dinos qué modelo quieres y te respondemos.</p>

    <form action="#" method="post">
      <label>Nombre
        <input type="text" name="nombre" required>
      </label>
      <label>Correo
        <input type="email" name="correo" required>
      </label>
      <label>Modelo
        <select name="modelo">
          <option>Modelo 1</option>
          <option>Modelo 2</option>
          <option>Modelo 3</option>
        </select>
      </label>
      <label>Mensaje
        <textarea name="mensaje" rows="4" placeholder="Escribe tu talla y tus dudas"></textarea>
      </label>
      <button class="boton" type="submit">Enviar</button>
    </form>

    <h2>Otras formas de contacto</h2>
    <ul>
      <li>WhatsApp: <a href="https://wa.me/523334929619" target="_blank">+52 333 492 9619</a></li>
      <li>Instagram: <a href="https://instagram.com/monkey_kicks2" target="_blank">@monkey_kicks2</a></li>
      <li>Horario: lunes a sábado, de 10:00 a 20:00</li>
    </ul>
  </main>
  <footer>
    <p>&copy; <span id="anio">2026</span> Monkey Kicks &middot; Proyecto Integradora II</p>
  </footer>
</body>
</html>
